[package]
name = "sablier"
version = "0.2.0"
description = "Sablier: engagement tracking, activity statements and work organisation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# custom-protocol: the page is embedded in the executable, with no development server.
tauri = { version = "2.12.5", features = ["macos-private-api", "custom-protocol", "devtools"] }
tauri-plugin-single-instance = "2.5.5"
# preserve_order and float_roundtrip: the JSON files keep their key order and their exact numbers, as under Electron.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-user-notifications = "0.3.2"

[target.'cfg(windows)'.dependencies]
# The same versions as wry's: the WebView2 COM types must be the same ones.
webview2-com = "=0.39.1"
windows = "=0.62.2"
base64 = "0.21"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
trash = "5"

[profile.release]
strip = true
lto = "thin"
